name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build one-folder app
        run: pyinstaller --noconfirm --clean FlowClick.spec

      - name: Create download archive
        shell: powershell
        run: Compress-Archive -Path dist\FlowClickStudio -DestinationPath FlowClickStudio-windows-x64.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FlowClickStudio-windows-x64
          path: FlowClickStudio-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
